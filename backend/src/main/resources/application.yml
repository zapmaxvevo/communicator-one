spring:
  application:
    name: communicator-one
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/communicator_one}
    username: ${DB_USERNAME:communicator_one}
    password: ${DB_PASSWORD:communicator_one}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health

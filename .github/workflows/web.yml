name: Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "backend/openapi.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "backend/openapi.json"
      - ".github/workflows/web.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Check generated API client
        run: |
          npm run generate:api
          if [ -n "$(git status --porcelain -- src/api)" ]; then
            git status --porcelain -- src/api
            git add -N src/api
            git diff -- src/api
            echo "::error::web/src/api is out of date: run npm run generate:api and commit the result"
            exit 1
          fi

      - run: npm run lint

      - run: npm test

      - run: npm run build
